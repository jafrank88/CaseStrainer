# Pytest config: regression gate for CI (aligned with wolf-style UX paths).
# Run: python -m pytest -c pytest-wolf.ini
# Requires: Redis for some tests (CASSTRAINER_USE_TEST_REDIS=1 in workflows).
#
# Only lists test files that exist in the repo. Slow / optional suites:
#   tests/test_production_unseen_documents.py  → run with: pytest -c pytest-wolf.ini -m production
#   (or: pytest tests/test_production_unseen_documents.py -m production)

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    tests/test_generalized_regressions.py
    tests/test_imports.py
    tests/test_analyze_async_contract.py
    tests/test_response_finalize.py
    -q
    --tb=short
    --timeout=300

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

loggers =
    pdfminer=WARNING
    pdfminer.psparser=WARNING
    pdfminer.pdfinterp=WARNING
    pdfminer.cmapdb=WARNING

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    production: production-style checks (e.g. novel documents, full stack)
    wolf_regression: validates cluster/API/display behavior users see on wolf.law.uw.edu
