# CaseStrainer configuration for wolf.law.uw.edu/casestrainer/
# IMPORTANT: API requests must receive the full path /casestrainer/api/... so the Flask app matches.
# Use proxy_pass WITHOUT a trailing slash so the request URI is passed unchanged.
server {
    listen 80;
    listen 443 ssl;
    server_name wolf.law.uw.edu;
    client_max_body_size 50m;

    ssl_certificate /etc/ssl/WolfCertBundle.crt;
    ssl_certificate_key /etc/ssl/wolf.law.uw.edu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API: proxy to backend with FULL path preserved (no trailing slash on proxy_pass)
    location ^~ /casestrainer/api/ {
        proxy_pass http://10.158.120.151:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /casestrainer;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
    }

    # CaseStrainer app (frontend / non-API): proxy with full path so backend or frontend receives /casestrainer/...
    location /casestrainer/ {
        proxy_pass http://10.158.120.151:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /casestrainer;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
