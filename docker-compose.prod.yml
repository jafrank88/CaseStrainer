services:
  # Data Layer
  redis:
    image: redis:7-alpine
    container_name: casestrainer-redis-prod
    ports:
      - "6380:6379"
    volumes:
      - redis_data_prod:/data
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - app-network
    command: ["sh", "-c", "redis-server --bind 0.0.0.0 --port 6379 --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]

  # Application Layer
  backend:
    build: .
    container_name: casestrainer-backend-prod
    command: waitress-serve --host=0.0.0.0 --port=5000 src.app_final_vue:app
    ports:
      - "5000:5000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@casestrainer-redis-prod:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - PYTHONPATH=/app
      - LOG_LEVEL_CASE_NAME_EXTRACTION=INFO
      - COURTLISTENER_API_KEY=${COURTLISTENER_API_KEY}
      - ENABLE_VERIFICATION=true
      - SKIP_FALLBACK_VERIFICATION=true
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./citation_cache:/app/citation_cache
      - ./correction_cache:/app/correction_cache
      - ./static:/app/static
    restart: always
    mem_limit: 4g
    mem_reservation: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/casestrainer/api/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    networks:
      - app-network
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Worker Services (4 GB each; 6 workers fit on 32 GB host: 6×4 + ~8 other = 32)
  rqworker1:
    build: .
    container_name: casestrainer-rqworker1-prod
    command: sh -c "find /app/src -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; python -B wait-for-redis.py && python -B src/rq_worker.py"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@casestrainer-redis-prod:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CASTRAINER_ENV=production
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - COURTLISTENER_API_KEY=${COURTLISTENER_API_KEY}
      - RQ_QUEUE_NAME=casestrainer
      - RQ_MAX_JOBS=100
      - RQ_MAX_MEMORY_MB=2048
      - RQ_WORKER_AUTORELOAD=false
      - WORKER_ID=1
      - ENABLE_VERIFICATION=true
      - SKIP_FALLBACK_VERIFICATION=true
      - MALLOC_ARENA_MAX=2
      - MALLOC_MMAP_THRESHOLD_=268435456
      - MALLOC_TRIM_THRESHOLD_=131072
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./logs:/app/logs
      - ./casestrainer_sessions:/app/casestrainer_sessions
    restart: always
    mem_limit: 4g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD", "python", "src/healthcheck_rq.py"]
      interval: 60s
      timeout: 30s
      retries: 8
      start_period: 180s
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

