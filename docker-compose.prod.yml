  # Job Health Monitor - Automatically cleans up stuck jobs
  job-health-monitor:
    build: .
    container_name: casestrainer-job-health-monitor-prod
    command: python src/job_health_monitor.py
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@casestrainer-redis-prod:6379/0
      - PYTHONPATH=/app
      - JOB_STUCK_THRESHOLD_SEC=600
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
    restart: always
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Frontend Development Mode (Live Code)
  frontend-prod:
    build: 
      context: ./casestrainer-vue-new
      dockerfile: Dockerfile.prod.simple
    container_name: casestrainer-frontend-prod
    ports:
      - "8080:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
      - NODE_ENV=production
      - VITE_COURTLISTENER_API_KEY=${COURTLISTENER_API_KEY}
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 60s
      timeout: 30s
      retries: 8
      start_period: 180s
    networks:
      - app-network

  # Infrastructure Layer
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: casestrainer-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf:/etc/nginx/conf:ro
      - ./nginx/conf.d/casestrainer.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    environment:
      - NGINX_HOST=wolf.law.uw.edu
      - NGINX_PORT=80
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    # Start Nginx with our config - wait for backend DNS propagation first
    command: >
      sh -c "echo 'Waiting for backend DNS...' &&
             for i in 1 2 3 4 5; do 
               if wget -q --spider --timeout=2 http://casestrainer-backend-prod:5000/casestrainer/api/health; then 
                 echo 'Backend reachable!'; break; 
               fi; 
               echo 'Waiting...'; sleep 2; 
             done &&
             nginx -t &&
             nginx -g 'daemon off;'"
    depends_on:
      backend:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  redis_data_prod:

networks:
  app-network:
    driver: bridge
