[pytest]
# Test discovery (src has no pytest modules; wolf regression lives under tests/)
testpaths = tests
norecursedirs =
    unit analysis debug clustering extraction integration performance
    validation verification e2e
    .git __pycache__ .pytest_cache node_modules dist build
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration (pytest-asyncio)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Warning filters
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Coverage configuration
addopts = 
    --cov=src
    --cov-report=html
    --cov-report=xml
    --cov-report=term-missing
    --cov-fail-under=1
    -v
    --tb=short
    --timeout=300
loggers =
    pdfminer=WARNING
    pdfminer.psparser=WARNING
    pdfminer.pdfinterp=WARNING
    pdfminer.cmapdb=WARNING
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    production: production-style checks (e.g. novel documents, full stack)
    wolf_regression: validates cluster/API/display behavior users see on wolf.law.uw.edu