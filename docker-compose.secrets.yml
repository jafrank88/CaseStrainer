version: '3.8'

services:
  # Infrastructure Layer
  nginx:
    image: nginx:alpine
    container_name: casestrainer-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./ssl/WolfCertBundle.crt:/etc/nginx/ssl/WolfCertBundle.crt
      - ./static:/usr/share/nginx/html/static
    secrets:
      - ssl_key
    depends_on:
      backend:
        condition: service_healthy
      frontend-prod:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-kf", "https://localhost/casestrainer/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

secrets:
  ssl_key:
    file: ./ssl/wolf.law.uw.edu.key
