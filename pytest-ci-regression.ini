# Pytest config: default regression gate for CI and `scripts/ci_regression.py`.
#
# Run locally (same as GitHub Actions):
#   python scripts/ci_regression.py
#
# Marker filtering (not local_briefs, not local_pdf, not production) is applied by the script;
# use --with-local-pdf / --with-production / --with-downloaded-briefs to widen.
#
# For the legacy file list without those filters, use pytest-wolf.ini or
#   pwsh scripts/run_wolf_regression_tests.ps1

[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    tests/test_generalized_regressions.py
    tests/test_brief_golden_expectations.py
    tests/test_justice_osg_brief_corpus.py
    tests/test_mismatch_party_line.py
    tests/test_imports.py
    tests/test_analyze_async_contract.py
    tests/test_response_finalize.py
    -q
    --tb=short
    --timeout=300

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

loggers =
    pdfminer=WARNING
    pdfminer.psparser=WARNING
    pdfminer.pdfinterp=WARNING
    pdfminer.cmapdb=WARNING

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    production: production-style checks (e.g. novel documents, full stack)
    local_pdf: optional tests that require a PDF on disk (skipped in CI if missing)
    local_briefs: optional tests over downloaded_briefs/ (requires CASSTRAINER_DOWNLOADED_BRIEF_TESTS=1)
    wolf_regression: validates cluster/API/display behavior users see on wolf.law.uw.edu
